
name: Build Signed Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Assemble signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm run typecheck:e2e
          npm test

      - name: Build production web bundle
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Missing keystore secret"
            exit 1
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Configure release signing
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          source = path.read_text()

          if "signingConfigs {" not in source:
              signing = "\n".join([
                  "    signingConfigs {",
                  "        release {",
                  '            storeFile file("release.keystore")',
                  '            storePassword System.getenv("RELEASE_STORE_PASSWORD")',
                  '            keyAlias System.getenv("RELEASE_KEY_ALIAS")',
                  '            keyPassword System.getenv("RELEASE_KEY_PASSWORD")',
                  "        }",
                  "    }",
                  ""
              ])

              source = source.replace(
                  "    buildTypes {",
                  signing + "    buildTypes {",
                  1
              )

          needle = "        release {\n            minifyEnabled false"
          replacement = (
              "        release {\n"
              "            signingConfig signingConfigs.release\n"
              "            minifyEnabled false"
          )

          if needle not in source:
              if "signingConfig signingConfigs.release" not in source:
                  raise SystemExit("Release buildTypes configuration not found")

          else:
              source = source.replace(needle, replacement, 1)

          path.write_text(source)
          PY

      - name: Assemble signed release APK
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: karal-physics-lab-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

